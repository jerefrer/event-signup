# Brute-force protection for the admin login (the app also rate-limits per IP).
limit_req_zone $binary_remote_addr zone=event_signup_login:10m rate=10r/m;

server {
    server_name evenements.chanteloube.fr;

    add_header Strict-Transport-Security "max-age=86400" always;

    location = /admin/login {
        limit_req zone=event_signup_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host "";
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host "";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/evenements.chanteloube.fr/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/evenements.chanteloube.fr/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = evenements.chanteloube.fr) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name evenements.chanteloube.fr;
    return 404; # managed by Certbot
}