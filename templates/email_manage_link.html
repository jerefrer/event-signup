{{define "email_content"}}
{{$p := "margin:0 0 1em;color:#000000;line-height:24px;"}}
<p style="{{$p}}">{{.Greeting}}</p>
<p style="{{$p}}">{{.Intro}}</p>
<div style="text-align:center;margin:24px 0;">
    <a href="{{.URL}}" style="display:inline-block;background-color:#c0392b;color:#ffffff;padding:12px 24px;text-decoration:none;border-radius:4px;font-weight:500;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;">{{.ButtonText}}</a>
</div>
<p style="font-style:italic;color:#5f5f5f;font-size:14px;padding:12px 16px;background-color:#FFFBEB;border:1px solid #FDE68A;border-radius:6px;margin:24px 0 0;line-height:21px;">{{.Note}}</p>
{{end}}
{{template "email_layout" .}}
